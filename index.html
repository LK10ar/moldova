<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moldova Explorer — Vin, culture & Transnistrie</title>
<meta name="description" content="Circuits, vin, monastères, événements et Transnistrie en Moldavie.">
<style>
:root{--bg:#fbf7ef;--fg:#2a2118;--mut:#6f6250;--card:#fff;--line:#e6dcc8;--acc:#8c2340;--acc2:#2f5d3a}
@media(prefers-color-scheme:dark){:root{--bg:#14100b;--fg:#f3ead9;--mut:#b5a78f;--card:#211b13;--line:#3a3022;--acc:#e58aa0}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Georgia,serif}
body.lock,body.nav-open{overflow:hidden}
button,select,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1190px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font-weight:700;font-size:22px;color:var(--acc);text-decoration:none;margin-inline-end:auto}
nav{display:flex;gap:2px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button:hover{background:var(--line)}
nav button.on{border-color:var(--acc);color:var(--acc)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.bg{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:38px;font-size:22px;line-height:1;cursor:pointer;position:relative;z-index:40}
#scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none}
.hero{padding:84px 16px;text-align:center;color:#fff;background:linear-gradient(#0005,#000a),var(--hero,linear-gradient(135deg,#8c2340,#2f5d3a));background-size:cover;background-position:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,52px);text-shadow:0 2px 12px #0008}
.hero p{margin:0;font-size:clamp(15px,2.4vw,19px);text-shadow:0 2px 8px #0008}
main{max-width:1180px;margin:auto;padding:22px 16px;scroll-margin-top:90px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#q{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;flex:0 1 260px;min-width:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px #0006;outline:none}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#e0a040,#b5451b) center/cover;display:grid;place-items:center;font-size:40px}
.ph.ld span{display:none}
.card .b{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:18px}
.meta{font:13px system-ui;color:var(--mut)}
.ds{margin:6px 0 0;font:14px/1.45 system-ui;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font:12px system-ui;background:var(--line);border-radius:6px;padding:3px 8px;margin:6px 6px 0 0}
html[dir=rtl] .tag{margin:6px 0 0 6px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:24px 16px;font:14px system-ui;color:var(--mut)}
footer .in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:var(--mut)}footer .cr{flex-basis:100%;font-size:12px}
#top{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px #0006;opacity:0;pointer-events:none;transform:translateY(12px);transition:.25s;z-index:50}
#top.show{opacity:1;pointer-events:auto;transform:none}
/* fiche détail */
#modal{position:fixed;inset:0;z-index:60;background:#000c;overflow-y:auto;overscroll-behavior:contain}
.x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:70;width:42px;height:42px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:22px;cursor:pointer}
.sheet{max-width:980px;margin:3vh auto;background:var(--card);border-radius:16px;overflow:hidden;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.mh{position:relative;height:clamp(250px,48vh,460px);background:linear-gradient(135deg,#e0a040,#b5451b) center/cover}
.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--card))}
.mh h2{position:absolute;z-index:1;inset-inline:24px;bottom:14px;margin:0;font-size:clamp(26px,5vw,44px);line-height:1.15}
.mb{padding:4px 24px 30px}
.mb section{margin-top:24px}
.mb h3{margin:0 0 8px;color:var(--acc);font-size:21px}
.mb p{margin:0 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts b{display:block;font:12px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stg span{font:14px system-ui;border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--bg)}
.car{position:relative;min-width:0;max-width:100%}.gal{min-width:0;max-width:100%;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.cb{position:absolute;top:50%;translate:0 -50%;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:22px;cursor:pointer}.cb[data-d="-1"]{inset-inline-start:6px}.cb[data-d="1"]{inset-inline-end:6px}.vid{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:0 0 10px}.lbn{position:fixed;top:50%;translate:0 -50%;width:46px;height:46px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:28px;cursor:pointer}
.gal img{flex:0 0 auto;width:min(78vw,420px);max-width:100%;height:auto;scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--line)}
.gal img:hover{transform:scale(1.03)}
.sk{color:var(--mut);font:14px system-ui}
.src{font:13px system-ui;color:var(--mut)}.src a{color:var(--acc)}
#mx iframe{width:100%;height:340px;border:0;border-radius:12px;background:var(--line)}
.lb{position:fixed;inset:0;z-index:90;background:#000e;display:grid;place-items:center;cursor:zoom-out}
.lb{grid-template:minmax(0,1fr)/minmax(0,1fr)}.lb>img{grid-area:1/1;width:auto;height:auto;max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
@media(max-width:1360px){
 .bg{display:block}
 nav{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(82vw,310px);background:var(--card);flex-direction:column;padding:calc(70px + env(safe-area-inset-top,0px)) 14px 16px;gap:6px;transform:translateX(100%);transition:transform .25s;z-index:30;box-shadow:-8px 0 30px #0008}
 html[dir=rtl] nav{transform:translateX(-100%);box-shadow:8px 0 30px #0008}
 body.nav-open nav{transform:none}
 body.nav-open #scrim{display:block}
 nav button{text-align:start;font-size:18px;padding:13px 12px}
}
@media(max-width:820px){
 .sheet{margin:0;border-radius:0;min-height:100%}
 .mb{padding:4px 16px 30px}
 .mh h2{inset-inline:16px}
 .hero{padding:56px 16px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
}
.pin{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px #0007;font-size:16px}
#bigmap{height:min(72vh,660px);border-radius:14px;border:1px solid var(--line);position:relative;z-index:0}
nav{min-width:0;margin-inline-start:auto}
@media(max-width:1360px){nav{overflow-x:visible}}@media(max-width:820px){#bigmap{height:68vh}}
.logo{white-space:nowrap}

.pp{width:210px;max-width:100%;border-radius:8px;display:block;margin:0 0 6px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font:13px system-ui;color:var(--mut)}.lgd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}

/* ================= Landing + motion 3D (ajout, rien de l'existant n'est retiré) ================= */
:root{--gold:#ffc83d;--ff:'Playfair Display',Georgia,serif}
#sp{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;pointer-events:none;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--p1),var(--gold))}

/* --- header en verre par-dessus la vidéo --- */
header{transition:background .35s,border-color .35s}
header::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
body.on-hero header{background:transparent;border-bottom-color:transparent}
body.on-hero header::before{background:linear-gradient(#000b,#0000)}
body.on-hero .logo{color:#fff;text-shadow:0 2px 14px #0009}
body.on-hero .bg{color:#fff;border-color:#fff6}
body.on-hero select{background:#ffffff1f;color:#fff;border-color:#fff5}
body.on-hero select option{color:#111;background:#fff}
@media(min-width:1361px){
 body.on-hero nav button{color:#fff;text-shadow:0 1px 10px #0009}
 body.on-hero nav button:hover{background:#ffffff26}
 body.on-hero nav button.on{border-color:#fff;color:#fff}
}

/* --- hero --- */
.hero{position:relative;isolation:isolate;overflow:hidden;margin-top:calc(var(--hh,58px)*-1);padding:calc(var(--hh,58px) + 30px) 20px 28px;min-height:100vh;min-height:min(100svh,960px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;perspective:1200px}
.hero video{position:absolute;left:0;top:-4%;width:100%;height:108%;object-fit:cover;z-index:-2;animation:vfade 1.2s ease both;transform:translate3d(0,var(--vy,0px),0) scale(var(--vs,1.02));will-change:transform}
@keyframes vfade{from{opacity:0}to{opacity:1}}
.hero video.fail{display:none}
.hero-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,#0000 0%,#0007 75%),linear-gradient(#0005,#0007 60%,#000c)}
.hero-in{position:relative;z-index:2;width:100%;max-width:1000px;will-change:transform,opacity;transition:transform .18s ease-out}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:99px;font:600 12px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#fff;background:#ffffff1a;border:1px solid #ffffff40;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.hero h1{font-family:var(--ff);font-weight:600;font-size:clamp(40px,8.2vw,112px);line-height:1.02;letter-spacing:-.02em;margin:22px 0 16px;text-shadow:0 6px 40px #0009}
.hero #sub{max-width:660px;margin:0 auto;font-size:clamp(16px,2vw,21px);line-height:1.5;text-shadow:0 2px 18px #000a}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.btn{font:600 15px/1 system-ui,sans-serif;padding:15px 26px;border-radius:99px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn:hover svg{transform:translateX(3px)}
.btn.pri{background:linear-gradient(135deg,var(--p1),var(--p1d));color:#fff;box-shadow:0 10px 30px color-mix(in srgb,var(--p1) 40%,transparent),inset 0 1px 0 #ffffff33}
.btn.pri:hover{box-shadow:0 14px 38px color-mix(in srgb,var(--p1) 67%,transparent),inset 0 1px 0 #ffffff33}
.btn.ghost{background:#ffffff1c;color:#fff;border-color:#ffffff55;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.ghost:hover{background:#ffffff33}
.hero-stats{list-style:none;padding:0;margin:44px auto 0;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;width:min(820px,100%)}
.hero-stats li{padding:16px 14px;border-radius:18px;background:#ffffff14;border:1px solid #ffffff2e;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 #ffffff26;color:#fff}
.hero-stats b{display:block;font:600 clamp(26px,3.4vw,38px)/1 var(--ff)}
.hero-stats span{display:block;margin-top:7px;font:12px/1.25 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.82}
.cue{display:block;margin:26px auto 0;width:26px;height:42px;border:2px solid #fff9;border-radius:14px;position:relative}
.cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:4px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.vctl{position:absolute;right:18px;bottom:18px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0008;border:1px solid #fff4;color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s,background .2s}
.vctl:hover{transform:scale(1.08);background:#000b}
.vctl svg{width:18px;height:18px;fill:currentColor}
.vctl .i-play{display:none}.vctl.paused .i-play{display:block}.vctl.paused .i-pause{display:none}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-in>*{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
.hero-in>.eyebrow{animation-delay:.1s}.hero-in>h1{animation-delay:.22s}.hero-in>#sub{animation-delay:.36s}.hero-in>.hero-cta{animation-delay:.5s}.hero-in>.hero-stats{animation-delay:.65s}.hero-in>.cue{animation-delay:.8s}
@media(max-width:640px){.hero-stats{grid-template-columns:repeat(2,1fr);margin-top:30px}.cue{display:none}.hero{padding-bottom:36px}}

/* --- révélations au scroll --- */
.fx .rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.fx .rv.is-in{opacity:1;transform:none}
.kicker{display:block;font:700 12px/1 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.sec-head{text-align:center;padding:0 20px}
.sec-title{font:600 clamp(32px,5.4vw,68px)/1.05 var(--ff);letter-spacing:-.02em;margin:0}

/* --- phrase qui s'allume au scroll --- */
.statement{padding:clamp(80px,14vw,180px) 20px clamp(40px,6vw,80px);text-align:center;scroll-margin-top:60px}
.statement p{font:500 clamp(24px,4.2vw,52px)/1.24 var(--ff);max-width:1050px;margin:0 auto;letter-spacing:-.01em}
.statement .w{opacity:.14;display:inline-block;white-space:pre}

/* --- cartes empilées 3D (chaque item reste collé en haut, le suivant glisse par-dessus) --- */
.stack{padding:clamp(40px,6vw,90px) 16px 0}
.stack-list{max-width:1180px;margin:24px auto 0;position:relative;padding-bottom:4vh}
.stack-item{position:sticky;top:calc(var(--hh,58px) + 24px);height:85vh;height:85svh;display:flex;align-items:flex-start;justify-content:center}
.stack-card{--i:0;--sc:1;--br:1;position:absolute;left:0;top:calc(var(--i)*28px);width:100%;height:min(68vh,600px);height:min(68svh,600px);min-height:380px;border-radius:32px;overflow:hidden;background:var(--g,#333) center/cover;color:#fff;transform-origin:50% 0;transform:scale(var(--sc));filter:brightness(var(--br));box-shadow:0 -10px 50px #0008,0 30px 70px #0006;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(22px,4vw,48px);isolation:isolate;will-change:transform;border:1px solid #ffffff1f}
.stack-card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#0000 30%,#000d),linear-gradient(90deg,#000a,#0000 70%)}
.stack-num{position:absolute;top:clamp(18px,3vw,36px);left:clamp(22px,4vw,48px);font:600 clamp(48px,9vw,120px)/1 var(--ff);opacity:.92;text-shadow:0 8px 30px #0006}
.stack-tag{position:absolute;top:clamp(22px,3.4vw,42px);right:clamp(22px,4vw,48px);padding:8px 14px;border-radius:99px;background:#ffffff1f;border:1px solid #ffffff44;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:600 12px/1 system-ui,sans-serif;letter-spacing:.04em}
.stack-card h3{font:600 clamp(30px,5vw,64px)/1.03 var(--ff);margin:0 0 10px;letter-spacing:-.01em}
.stack-card p{max-width:560px;margin:0 0 22px;font:16px/1.5 system-ui,sans-serif;opacity:.94}

/* --- galerie défilante en perspective --- */
.band{padding:clamp(56px,8vw,110px) 0;overflow:hidden;perspective:1600px}
.band .sec-head{margin-bottom:40px}
.mq-rows{display:grid;gap:16px;transform:rotateX(9deg) rotateZ(-1.5deg) scale(1.04);transform-style:preserve-3d}
.mq-row{display:flex;gap:16px;width:max-content;will-change:transform}
.mq-tile{position:relative;flex:0 0 auto;width:clamp(230px,24vw,360px);aspect-ratio:3/2;border-radius:22px;overflow:hidden;background:var(--line) center/cover;cursor:pointer;box-shadow:0 18px 44px #0004;transition:transform .35s,filter .35s;outline-offset:3px}
.mq-tile:hover,.mq-tile:focus-visible{transform:translateY(-6px) scale(1.03)}
.mq-tile b{position:absolute;left:0;right:0;bottom:0;padding:38px 16px 14px;color:#fff;font:600 15px/1.2 system-ui,sans-serif;background:linear-gradient(#0000,#000b)}

/* --- globe --- */
.earth{position:relative;overflow:hidden;isolation:isolate;background:#050510;color:#fff;padding:clamp(70px,10vw,140px) 20px clamp(120px,14vw,200px)}
.earth::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 140px 70px,rgba(255,255,255,.9),transparent),radial-gradient(1.5px 1.5px at 90px 140px,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 160px 220px,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 320px 40px,rgba(255,255,255,.8),transparent);background-size:400px 400px}
.earth-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.earth-in.nog{grid-template-columns:1fr;max-width:760px;text-align:center}
.earth .kicker{color:#8fd6ff}
.earth h2{font:600 clamp(32px,5vw,64px)/1.05 var(--ff);letter-spacing:-.02em;margin:0 0 18px}
.earth p{font:17px/1.6 system-ui,sans-serif;color:#b0b0c0;margin:0 0 26px;max-width:520px}
.earth-in.nog p{margin-inline:auto}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{padding:14px 16px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff1a;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left}
.fact b{display:block;margin-bottom:5px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8fd6ff}
.fact span{font:15px/1.35 system-ui,sans-serif;color:#eef}
.globe{position:relative;aspect-ratio:1;width:min(100%,560px);margin:auto}
.globe canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.globe canvas:active{cursor:grabbing}
.g-tag{position:absolute;left:0;top:0;pointer-events:none;padding:6px 12px 6px 10px;border-radius:99px;background:#000a;border:1px solid #ffffff44;font:600 13px/1 system-ui,sans-serif;white-space:nowrap;opacity:0;transition:opacity .25s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.g-tag.on{opacity:1}
.g-ctl{position:absolute;right:2px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:2}
.g-ctl button{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;background:#0b1224cc;color:#fff;font:600 20px/1 system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:0;transition:transform .2s,background .2s,border-color .2s}
.g-ctl button:hover{transform:scale(1.1);background:#1a2a55;border-color:#8fd6ff}
.g-ctl button:focus-visible{outline:2px solid #8fd6ff;outline-offset:2px}

const wapi=async(h,p)=>{
 const u=new URL(h==='commons'?'https://commons.wikimedia.org/w/api.php':`https://${h}.wikipedia.org/w/api.php`);
 Object.entries({action:'query',format:'json',origin:'*',redirects:1,...p}).forEach(([k,v])=>u.searchParams.set(k,v));
 const r=await fetch(u);if(!r.ok)throw new Error('http');
 const j=await r.json();return Object.values((j.query&&j.query.pages)||{});
};

const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const GEN=/^(vinaria|winery|chateau|castel|domaine|crama|cave|monastere|musee|parc|lac|grotte|pestera|de|la|le|les|des|du|din|the|and|mai)$/;
const ovrOf=it=>{if(it.cover)return null;const nn=nrm((it.n&&it.n.fr)||it.w||'');for(const k in OVR)if(nn.includes(k))return OVR[k];return null};
function nameOk(it,title){
 const T=nrm(title),toks=nrm(((it.n&&it.n.fr)||'')+' '+(it.cat==='g'&&it.sub==='vin'?'':(it.w||''))).split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!GEN.test(t));
 return !toks.length||toks.some(t=>T.includes(t));
}
async function cover(it,sz=500){
 if(it.cover)return it.cover;
 const ov=ovrOf(it);if(ov)return ov;
 it.cvs=it.cvs||{};
 if(it.cvs[sz]!==undefined)return it.cvs[sz];
 const key='md2:'+it.id+':'+sz;
 try{const c=JSON.parse(ls.get(key)||'null');if(c&&Date.now()-c.t<6048e5)return it.cvs[sz]=c.u}catch{}
 let u=null,ok=false;
 try{
  const ps=(await wapi('fr',{generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz})).sort((a,b)=>a.index-b.index);
  const p=ps.find(p=>p.thumbnail&&!BAD.test(p.title+' '+p.thumbnail.source)&&nameOk(it,p.title));u=p?p.thumbnail.source:null;ok=true;
   if(!u){const p2=(await wapi('fr',{generator:'search',gsrsearch:tx(it.n,'fr')+' Moldavie',gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz}))  .sort((a,b)=>a.index-b.index).find(p=>p.thumbnail&&!BAD.test(p.title+' '+p.thumbnail.source)&&nameOk(it,p.title));u=p2?p2.thumbnail.source:null}
 }catch{}
 it.cvs[sz]=u;
 if(ok)ls.set(key,JSON.stringify({u,t:Date.now()}));
 return u;
}
async function detail(it,lg){
 if(ovrOf(it))return{gal:[]};
 const p={generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'extracts|pageimages|coordinates|langlinks',exintro:1,explaintext:1,exlimit:'max',piprop:'thumbnail',pithumbsize:1280,colimit:1,lllimit:1};
 if(lg!=='fr')p.lllang=lg;
 const ps=(await wapi('fr',p)).sort((a,b)=>a.index-b.index);
 const m=ps[0];if(!m||!nameOk(it,m.title))return{gal:[]};
 const r={title:m.title,wl:'fr',text:m.extract||'',gal:[]};
 const im=ps.find(x=>x.thumbnail);r.img=im&&im.thumbnail.source;
 const co=(m.coordinates||[])[0];if(co){r.lat=co.lat;r.lng=co.lon}
 const ll=m.langlinks&&m.langlinks[0];
 const jobs=[];
 if(lg!=='fr'&&ll)jobs.push(wapi(lg,{titles:ll['*'],prop:'extracts',exintro:1,explaintext:1}).then(a=>{const x=a[0];if(x&&x.extract){r.text=x.extract;r.title=x.title;r.wl=lg}}).catch(()=>{}));
 const kw=norm((it.w||tx(it.n,'fr')).split(/[ ,(]/)[0]);
 jobs.push(wapi('commons',{generator:'search',gsrnamespace:6,gsrsearch:(it.w||tx(it.n,'fr'))+' Moldova',gsrlimit:30,prop:'imageinfo',iiprop:'url|mime',iiurlwidth:960}).then(a=>{
   r.cg=a.filter(x=>{const i=x.imageinfo&&x.imageinfo[0];return i&&/jpeg/.test(i.mime)&&i.thumburl&&!BAD.test(x.title)&&(kw.length<4||norm(x.title).includes(kw))}).map(x=>x.imageinfo[0].thumburl).slice(0,16);
 }).catch(()=>{}));
 jobs.push(wapi('fr',{generator:'images',titles:m.title,gimlimit:50,prop:'imageinfo',iiprop:'url|mime',iiurlwidth:960}).then(a=>{
  r.gal=a.filter(x=>{const i=x.imageinfo&&x.imageinfo[0];return i&&/jpeg/.test(i.mime)&&i.thumburl&&!BAD.test(x.title)}).map(x=>x.imageinfo[0].thumburl).slice(0,12);
 }).catch(()=>{}));
 await Promise.all(jobs);
 r.gal=[...new Set([...(r.gal||[]),...(r.cg||[])])];
 return r;
}

function parseTrace(t){
 if(!t||typeof t!=='object')return null;
 const fs=t.type==='FeatureCollection'?(t.features||[]):t.type==='Feature'?[t]:[];
 const steps=[];let line=[];

const cnt=()=>{const I=md().ITEMS;return[

const shown=[0,0,0,0];
function animateNum(el,k,to){
  const from=shown[k];shown[k]=to;
  if(RM||from===to){el.textContent=to;return}
  const t0=performance.now(),d=1100;
  const step=t=>{const p=clamp((t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(lerp(from,to,e));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function counts(){
  const c=cnt();
  document.querySelectorAll('#hStats b').forEach(b=>{const k=+b.dataset.n;if(shown[k]!==c[k])animateNum(b,k,c[k])});
  const I=md().ITEMS,f=F();
  document.querySelectorAll('.stack-tag').forEach(t=>{
    const cat=['c','a','g','h','t'][+t.dataset.count]||'';
    const map={0:'c',2:'g',3:'h',4:'t'};

let userPaused=false;
function syncVideoBtn(){
  const v=$('hv'),b=$('vctl');if(!v||!b)return;
  b.classList.toggle('paused',v.paused);
  b.setAttribute('aria-label',v.paused?F().vplay:F().vpause);
}
function initVideo(){
  const v=$('hv'),hero=$('hero'),btn=$('vctl');if(!v)return;
  const srcs=[...v.querySelectorAll('source')],last=srcs[srcs.length-1];
  const fail=()=>{v.classList.add('fail');btn.hidden=true};
  last.addEventListener('error',fail);
  v.addEventListener('error',fail);
  v.addEventListener('loadeddata',()=>{hero.classList.add('vready');btn.hidden=false;if(RM&&!v.paused){v.pause();userPaused=true}syncVideoBtn()});
  v.addEventListener('play',syncVideoBtn);v.addEventListener('pause',syncVideoBtn);
  v.muted=true;
  if(RM){v.removeAttribute('autoplay');v.pause();userPaused=true}
  btn.addEventListener('click',()=>{if(v.paused){userPaused=false;v.play().catch(()=>{})}else{userPaused=true;v.pause()}});
  new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){if(!userPaused)v.play().catch(()=>{})}else v.pause();
  }),{threshold:.05}).observe(hero);
  // si la lecture n'a pas démarré (économie d'énergie...), on réessaie au premier geste
  const kick=()=>{if(!userPaused&&v.paused&&!v.classList.contains('fail'))v.play().catch(()=>{})};
  addEventListener('pointerdown',kick,{once:true,passive:true});
  addEventListener('scroll',kick,{once:true,passive:true});
}

/* ---------- choix des photos (indépendant des ids : marche avec les fiches du back-office) ---------- */
const nameOf=i=>nrm((i.n&&(i.n.fr||i.n.en))||i.w||'');
const isPlace=i=>i.cat!=='n'&&i.cat!=='e'&&!(i.cat==='g'&&i.sub==='plat');
const KEYS=['orheiul','soroca','cricova','milestii','bender','tiraspol','hancu','tipova','capriana','saharna','curchi','purcari','vartely','mimi','prut','cahul','codrii','morilor','eiffel','colinele','chisinau','noul neamt','kvint','asconi','comrat'];
function pickMarquee(){
  const I=md().ITEMS,out=[],seen=new Set();
  const add=i=>{if(i&&!seen.has(i.id)&&out.length<24){seen.add(i.id);out.push(i)}};
  I.filter(i=>i.cover&&isPlace(i)).slice(0,8).forEach(add);        // photos ajoutées depuis l'admin
  KEYS.forEach(k=>add(I.find(i=>isPlace(i)&&nameOf(i).includes(k))));
  I.filter(i=>['c','a','g','h','t'].includes(i.cat)&&isPlace(i)).forEach(add);
  return out;
}
function pickFor(k){
  const I=md().ITEMS;
  const by=(cat,keys)=>{for(const key of keys){const r=I.find(i=>i.cat===cat&&nameOf(i).includes(key));if(r)return r}return I.find(i=>i.cat===cat)};
  if(k==='c')return by('c',['codru','chisinau']);
  if(k==='g')return by('a',['milestii','cricova'])||by('g',['milestii','cricova']);
  if(k==='h')return by('h',['orheiul','soroca']);
  if(k==='t')return by('t',['bender','tiraspol']);
}
const setBg=(el,u,cls)=>{if(!u)return;const im=new Image();im.onload=()=>{el.style.backgroundImage='url("'+u.replace(/"/g,'%22')+'")';if(cls)el.classList.add(cls)};im.src=u};

/* ---------- galerie défilante ---------- */
let mqTok=0,rows=[];
const linkTarget=l=>{if(!l)return null;const I=md().ITEMS;return I.find(i=>i.slug===l)||I.find(i=>i.id===l)||I.find(i=>nameOf(i)===nrm(l))||null};
const capOf=(cap,L)=>{cap=cap||{};return cap[L]||''};
async function buildMarquee(){
  const tok=++mqTok,res=[];
  const admin=HOME.gallery&&HOME.gallery.length;
  if(admin){
    HOME.gallery.forEach(g=>res.push({u:g.url,cap:g.caption||{},link:g.link||''}));
  }else{
    const items=pickMarquee();
    for(let k=0;k<items.length&&res.length<16;k+=6){
      const chunk=items.slice(k,k+6);
      const urls=await Promise.all(chunk.map(i=>md().cover(i).catch(()=>null)));
      if(tok!==mqTok)return;
      chunk.forEach((it,j)=>{if(urls[j])res.push({it,u:urls[j]})});
    }
  }
  if(!admin&&res.length){try{const LG=['fr','en','es','ro','ru'];localStorage.setItem('md_autogal',JSON.stringify(res.filter(e=>e.it).map(e=>({url:e.u,caption:Object.fromEntries(LG.filter(l=>e.it.n&&e.it.n[l]).map(l=>[l,e.it.n[l]])),link:e.it.slug||e.it.id||''}))))}catch{}}
  const band=$('band');
  if(res.length<(admin?1:4)){band.hidden=true;return}
  band.hidden=false;
  const rowEls=[...band.querySelectorAll('.mq-row')];
  const lists=[res.filter((_,i)=>i%2===0),res.filter((_,i)=>i%2===1)];
  rows=rowEls.map((row,ri)=>{
    const list=lists[ri].length>=1&&res.length>=6?lists[ri]:res;
    row.innerHTML='';
    const mk=()=>{const fr=document.createDocumentFragment();list.forEach(e=>{
      const d=document.createElement('div');d.className='mq-tile';d.tabIndex=0;d.setAttribute('role','button');
      d.style.backgroundImage='url("'+e.u.replace(/"/g,'%22')+'")';
      let label='';
      if(e.it){d.dataset.open=e.it.id;d.dataset.id=e.it.id;label=md().tx(e.it.n)}
      else{
        d.dataset.cap=JSON.stringify(e.cap||{});
        label=capOf(e.cap,md().lang())||capOf(e.cap,'fr');
        const tg=linkTarget(e.link);
        if(tg)d.dataset.open=tg.id;
        else if(/^https?:\/\//i.test(e.link||''))d.dataset.href=e.link;
        else d.style.cursor='default';
      }
      if(label){const b=document.createElement('b');b.textContent=label;d.append(b)}
      fr.append(d)});return fr};
    row.append(mk());row.append(mk());
    row._len=list.length;row._mk=mk;
    return row;
  });
  measureRows();tick();
}
function measureRows(){
  rows.forEach(row=>{
    if(!row._len)return;
    while(row.children.length>row._len*2)row.lastChild.remove();
    const period=row.children[row._len].offsetLeft-row.children[0].offsetLeft;
    row._p=period;
    if(!(period>0))return;
    let sets=2;
    while(sets*period<period+innerWidth*1.4||sets<3){row.append(row._mk());sets++;if(sets>10)break}
  });
}
function captions(){
  const L=md().lang();
  document.querySelectorAll('.mq-tile').forEach(t=>{
    let label='';
    if(t.dataset.id){const it=md().byId(t.dataset.id);if(it)label=md().tx(it.n)}
    else if(t.dataset.cap){try{const c=JSON.parse(t.dataset.cap);label=capOf(c,L)||capOf(c,'fr')}catch{}}
    let b=t.querySelector('b');
    if(label){if(!b){b=document.createElement('b');t.append(b)}b.textContent=label}else if(b)b.remove();
  });
}

async function stackImage(k){

  const attr=document.createElement('span');attr.className='g-attr';attr.textContent='Imagerie © Esri, Maxar, Earthstar Geographics';box.append(attr);
  // photo satellite haute résolution autour de la Moldavie (chargée au premier zoom)
  let detail=null,detailTried=false,lastZ=-1;
  const loadDetail=async()=>{
    if(detailTried)return;detailTried=true;
    try{
      const Z=9,N=Math.pow(2,Z)*256,LO0=26.2,LO1=30.6,LA0=44.9,LA1=48.9;
      const px=lo=>(lo+180)/360*N,py=la=>{const r=la*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*N};
      const inv=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/N)))*180/Math.PI;
      const tx0=Math.floor(px(LO0)/256),tx1=Math.floor(px(LO1)/256),ty0=Math.floor(py(LA1)/256),ty1=Math.floor(py(LA0)/256);
      const W=(tx1-tx0+1)*256,H=(ty1-ty0+1)*256,cv2=document.createElement('canvas');cv2.width=W;cv2.height=H;
      const g2=cv2.getContext('2d');let ok=0,total=0;const jobs=[];
      for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){total++;jobs.push(new Promise(res=>{
        const im=new Image();im.crossOrigin='anonymous';
        im.onload=()=>{g2.drawImage(im,(x-tx0)*256,(y-ty0)*256);ok++;res()};im.onerror=()=>res();
        im.src='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+Z+'/'+y+'/'+x}))}
      await Promise.all(jobs);
      if(ok<total*.7)return;
      const t=new THREE.CanvasTexture(cv2);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;
      const ac=document.createElement('canvas');ac.width=ac.height=128;const ag=ac.getContext('2d'),id=ag.createImageData(128,128);
      for(let j=0;j<128;j++)for(let i=0;i<128;i++){const u=i/127,v=j/127,m=Math.min(u,1-u,v,1-v),a=Math.round(255*ease(clamp(m/.07))),o=(j*128+i)*4;id.data[o]=id.data[o+1]=id.data[o+2]=a;id.data[o+3]=255}
      ag.putImageData(id,0,0);
      const NX=40,NY=60,x0=tx0*256,x1=(tx1+1)*256,y0=ty0*256,y1=(ty1+1)*256,pos=[],uv=[],ind=[];
      for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){
        const xx=x0+(x1-x0)*i/NX,yy=y0+(y1-y0)*j/NY,v=toV(xx/N*360-180,inv(yy),2.0035);
        pos.push(v.x,v.y,v.z);uv.push(i/NX,1-j/NY)}
      for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1;ind.push(a,c,b,b,c,d)}
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(ind);
      detail=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,alphaMap:new THREE.CanvasTexture(ac),color:C(0xdcdcdc),transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}));
      detail.renderOrder=1;earth.add(detail);
    }catch(e){console.warn('[fx] imagerie',e)}
  };
  // orientation : globe toujours DROIT (axe nord-sud vertical), la Moldavie se place face caméra
  const ease=x=>x*x*(3-2*x);
  const focusY=-Math.atan2(mv.x,mv.z),TILT0=.4;
  let rotY=RM?focusY:focusY-2.4,tiltUser=0,zoom=0,zoomT=0,dragging=false,idleAt=0;
  const apply=()=>{
    globe.rotation.y=rotY;
    globe.rotation.x=lerp(TILT0,.8,ease(zoom))+tiltUser;
    cam.position.z=lerp(9.4,2.38,ease(zoom));
  };
  apply();
  // glisser pour tourner, pincer / boutons / double-clic pour zoomer
  const ptrs=new Map();let pinch=0;
  canvas.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId)}catch{}
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}
  });
  canvas.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    if(ptrs.size===2){
      p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch)zoomT=clamp(zoomT+(d-pinch)*.004);pinch=d;return;
    }
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    rotY+=dx*lerp(.006,.00045,ease(zoom));tiltUser=clamp(tiltUser+dy*lerp(.004,.0006,ease(zoom)),-.5,.5);dragging=true;
  });
  const up=e=>{ptrs.delete(e.pointerId);pinch=0;if(!ptrs.size){dragging=false;idleAt=performance.now()+2500}};
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();zoomT=clamp(zoomT-e.deltaY*.002)},{passive:false});
  canvas.addEventListener('dblclick',()=>{zoomT=zoomT>.5?0:1});
  const zin=$('gZin'),zout=$('gZout'),zr=$('gRst');
  if(zin)zin.onclick=()=>{zoomT=clamp(zoomT+.34)};
  if(zout)zout.onclick=()=>{zoomT=clamp(zoomT-.34)};
  if(zr)zr.onclick=()=>{zoomT=0;tiltUser=0;idleAt=0};
  // taille
  const resize=()=>{const w=box.clientWidth||400,h=box.clientHeight||w;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  resize();
  if('ResizeObserver' in window)new ResizeObserver(resize).observe(box);else addEventListener('resize',resize);
  // boucle : uniquement quand le globe est visible
  let visible=false,raf=0,t0=0;
  const wp=new THREE.Vector3(),cw=new THREE.Vector3();
  const frame=t=>{
    if(!visible)return;raf=requestAnimationFrame(frame);
    if(!t0)t0=t;
    const k=RM?1:clamp((t-t0)/1300),e=1-Math.pow(1-k,3);
    globe.scale.setScalar(.78+.22*e);
    clouds.rotation.y+=RM?0:.0005;
    const ks=Math.max((cam.position.z-2)/7.4,.06),zf=ease(clamp((zoom-.45)/.3));
    pin.scale.setScalar(ks);pin.material.opacity=1-zf;
    rings.forEach((r,i)=>{const q=((t/1500)+i*.5)%1;r.scale.setScalar(ks*(1+q*3.2));r.material.opacity=(1-q)*.85*(1-zf)});
    if(fill)fill.material.opacity=(RM?.2:.2+.05*Math.sin(t/650))*(1-.55*zf);
    if(ribbons&&Math.abs(cam.position.z-lastZ)>.004){lastZ=cam.position.z;ribbons.set(Math.max((cam.position.z-2)*.0019,.00055))}
    if(zoomT>.12)loadDetail();
    if(detail){const o=ease(clamp((zoom-.2)/.35));detail.material.opacity=o;attr.classList.toggle('on',o>.15)}
    if(!dragging&&performance.now()>idleAt&&zoom<.3){
      const target=focusY+(RM?0:Math.sin(t/2600)*.08*(1-zoom));
      let d=target-rotY;d=Math.atan2(Math.sin(d),Math.cos(d));
      rotY+=d*.035;tiltUser*=.94;
    }
    zoom+=(zoomT-zoom)*.12;
    apply();
    renderer.render(scene,cam);
    pin.getWorldPosition(wp);
    const facing=wp.z>.35;
    wp.project(cam);
    tag.style.transform=`translate(${((wp.x*.5+.5)*box.clientWidth+18).toFixed(1)}px,${((-wp.y*.5+.5)*box.clientHeight-14).toFixed(1)}px)`;
    tag.classList.toggle('on',facing&&k>.6&&zf<.5);
    const L2=md().lang();
    cityEls.forEach(ce=>{
      ce.dot.scale.setScalar(ks);ce.dot.material.opacity=zf;
      ce.dot.getWorldPosition(cw);const fc=cw.z>.3;cw.project(cam);
      const nm=ce.c.n[L2]||ce.c.d;if(ce.el.textContent!==nm)ce.el.textContent=nm;
      ce.el.style.transform='translate('+((cw.x*.5+.5)*box.clientWidth+10).toFixed(1)+'px,'+((-cw.y*.5+.5)*box.clientHeight-10).toFixed(1)+'px)';
      ce.el.classList.toggle('on',fc&&zf>.35)});
  };
  new IntersectionObserver(es=>es.forEach(en=>{
    visible=en.isIntersecting;
    if(visible){t0=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}else cancelAnimationFrame(raf);
  }),{threshold:.05}).observe(box);
}
function initGlobeLazy(){
  const e=$('earth');if(!e)return;
  if(!('IntersectionObserver' in window)){startGlobe();return}
  const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){io.disconnect();startGlobe()}},{rootMargin:'400px'});
  io.observe(e);
}

/* ---------- mise à jour appelée par le site à chaque rendu ---------- */
let lastSig='',mediaTimer=0;
const update=safe(()=>{
  if(!md())return;
  const L=md().lang();
  if(L!==curLang){curLang=L;applyText()}
  const ov=(HOME.texts&&HOME.texts[L])||{};if(ov.h1)$('h1').textContent=ov.h1;if(ov.sub)$('sub').textContent=ov.sub;
  counts();
  const I=md().ITEMS,sig=I.length+':'+I.filter(i=>i.api).length+':'+I.filter(i=>i.cover).length;
  if(sig!==lastSig){
    lastSig=sig;clearTimeout(mediaTimer);
    mediaTimer=setTimeout(safe(()=>{buildMarquee();loadStackImgs()}),lastSig?350:0);
  }
});
window.mdFX={update};

/* ---------- démarrage ---------- */
const init=safe(()=>{

})();
