select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.bg{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:38px;font-size:22px;line-height:1;cursor:pointer;position:relative;z-index:40}
#scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none}
.hero{padding:84px 16px;text-align:center;color:#fff;background:linear-gradient(#0005,#000a),var(--hero,linear-gradient(135deg,#8c2340,#2f5d3a));background-size:cover;background-position:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,52px);text-shadow:0 2px 12px #0008}
.hero p{margin:0;font-size:clamp(15px,2.4vw,19px);text-shadow:0 2px 8px #0008}
main{max-width:1180px;margin:auto;padding:22px 16px;scroll-margin-top:90px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}

.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px #0006;outline:none}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#e0a040,#b5451b) center/cover;display:grid;place-items:center;font-size:40px}
.ph.ld span{display:none}
.card .b{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:18px}
.meta{font:13px system-ui;color:var(--mut)}

#top.show{opacity:1;pointer-events:auto;transform:none}

.gal img{flex:0 0 min(78%,420px);scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--line)}

.sk{color:var(--mut);font:14px system-ui}
.src{font:13px system-ui;color:var(--mut)}.src a{color:var(--acc)}

.lb{position:fixed;inset:0;z-index:90;background:#000e;display:grid;place-items:center;cursor:zoom-out}
.lb img{max-width:96vw;max-height:92vh;border-radius:6px}

 .bg{display:block}

const wapi=async(h,p)=>{
 const u=new URL(h==='commons'?'https://commons.wikimedia.org/w/api.php':`https://${h}.wikipedia.org/w/api.php`);
 Object.entries({action:'query',format:'json',origin:'*',redirects:1,...p}).forEach(([k,v])=>u.searchParams.set(k,v));
 const r=await fetch(u);if(!r.ok)throw new Error('http');
 const j=await r.json();return Object.values((j.query&&j.query.pages)||{});
};

const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const GEN=/^(vinaria|winery|chateau|castel|domaine|crama|cave|monastere|musee|parc|lac|grotte|pestera|de|la|le|les|des|du|din|the|and|mai)$/;
const ovrOf=it=>{if(it.cover)return null;const nn=nrm((it.n&&it.n.fr)||it.w||'');for(const k in OVR)if(nn.includes(k))return OVR[k];return null};
function nameOk(it,title){
 const T=nrm(title),toks=nrm(((it.n&&it.n.fr)||'')+' '+(it.cat==='g'&&it.sub==='vin'?'':(it.w||''))).split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!GEN.test(t));
 return !toks.length||toks.some(t=>T.includes(t));
}
async function cover(it,sz=500){
 if(it.cover)return it.cover;
 const ov=ovrOf(it);if(ov)return ov;
 it.cvs=it.cvs||{};
 if(it.cvs[sz]!==undefined)return it.cvs[sz];
 const key='md2:'+it.id+':'+sz;
 try{const c=JSON.parse(ls.get(key)||'null');if(c&&Date.now()-c.t<6048e5)return it.cvs[sz]=c.u}catch{}
 let u=null,ok=false;
 try{
  const ps=(await wapi('fr',{generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz})).sort((a,b)=>a.index-b.index);
  const p=ps.find(p=>p.thumbnail&&!BAD.test(p.title+' '+p.thumbnail.source)&&nameOk(it,p.title));u=p?p.thumbnail.source:null;ok=true;
   if(!u){const p2=(await wapi('fr',{generator:'search',gsrsearch:tx(it.n,'fr')+' Moldavie',gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz}))  .sort((a,b)=>a.index-b.index).find(p=>p.thumbnail&&!BAD.test(p.title+' '+p.thumbnail.source)&&nameOk(it,p.title));u=p2?p2.thumbnail.source:null}
 }catch{}
 it.cvs[sz]=u;
 if(ok)ls.set(key,JSON.stringify({u,t:Date.now()}));
 return u;
}
async function detail(it,lg){
 if(ovrOf(it))return{gal:[]};
 const p={generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'extracts|pageimages|coordinates|langlinks',exintro:1,explaintext:1,exlimit:'max',piprop:'thumbnail',pithumbsize:1280,colimit:1,lllimit:1};
 if(lg!=='fr')p.lllang=lg;
 const ps=(await wapi('fr',p)).sort((a,b)=>a.index-b.index);
 const m=ps[0];if(!m||!nameOk(it,m.title))return{gal:[]};
 const r={title:m.title,wl:'fr',text:m.extract||'',gal:[]};
 const im=ps.find(x=>x.thumbnail);r.img=im&&im.thumbnail.source;
 const co=(m.coordinates||[])[0];if(co){r.lat=co.lat;r.lng=co.lon}
 const ll=m.langlinks&&m.langlinks[0];
 const jobs=[];
 if(lg!=='fr'&&ll)jobs.push(wapi(lg,{titles:ll['*'],prop:'extracts',exintro:1,explaintext:1}).then(a=>{const x=a[0];if(x&&x.extract){r.text=x.extract;r.title=x.title;r.wl=lg}}).catch(()=>{}));
 const kw=norm((it.w||tx(it.n,'fr')).split(/[ ,(]/)[0]);
 jobs.push(wapi('commons',{generator:'search',gsrnamespace:6,gsrsearch:(it.w||tx(it.n,'fr'))+' Moldova',gsrlimit:30,prop:'imageinfo',iiprop:'url|mime',iiurlwidth:960}).then(a=>{
   r.cg=a.filter(x=>{const i=x.imageinfo&&x.imageinfo[0];return i&&/jpeg/.test(i.mime)&&i.thumburl&&!BAD.test(x.title)&&(kw.length<4||norm(x.title).includes(kw))}).map(x=>x.imageinfo[0].thumburl).slice(0,16);
 }).catch(()=>{}));
 jobs.push(wapi('fr',{generator:'images',titles:m.title,gimlimit:50,prop:'imageinfo',iiprop:'url|mime',iiurlwidth:960}).then(a=>{
  r.gal=a.filter(x=>{const i=x.imageinfo&&x.imageinfo[0];return i&&/jpeg/.test(i.mime)&&i.thumburl&&!BAD.test(x.title)}).map(x=>x.imageinfo[0].thumburl).slice(0,12);
 }).catch(()=>{}));
 await Promise.all(jobs);
 r.gal=[...new Set([...(r.gal||[]),...(r.cg||[])])];
 return r;
}

  try{
   const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
   const r=await fetch(`${API}/api/${col}`,{signal:ctl.signal});clearTimeout(to);
   if(!r.ok)return;
   (await r.json()).forEach(x=>ITEMS.push(fromApi((x.tags||[]).includes('event')?'e':(x.wilaya||'').toLowerCase()==='transnistrie'?'t':cat,x)));
  }catch{}
 }));
 // les fiches importées dans la base remplacent celles codées en dur
 if(ITEMS.some(i=>i.api&&i.seeded))ITEMS.splice(0,ITEMS.length,...ITEMS.filter(i=>i.api));
 if($('modal').hidden)render();
}

/* ---------- Rendu de la page ---------- */
function render(){
 const t=T[lang],h=document.documentElement;
 h.lang=lang;h.dir='ltr';
 $('lang').value=lang;$('h1').textContent=t.h1;$('sub').textContent=t.sub;
 $('bg').setAttribute('aria-label',t.menu);$('top').setAttribute('aria-label',t.top);document.querySelector('.x').setAttribute('aria-label',t.close);
 $('nav').innerHTML=t.nav.map((n,i)=>`<button class="${i===tab?'on':''}" data-tab="${i}">${esc(n)}</button>`).join('');
 const ids=['mentions','cgu','confidentialite','securite'];
 $('foot').innerHTML=t.legal.filter((_,i)=>i!==2).map((l,i)=>`<a href="legal.html#${ids[i]}">${esc(l)}</a>`).join('')+`<span>© Moldova Explorer</span>`;
 const cat=CATS[tab];let chips='';
 if(cat==='m'){$('view').innerHTML=mapHtml();initMap();return}
 if(cat!=='n'&&cat!=='e'){
  const subs=cat==='c'?['centre','nord','sud','gagaouzie','transnistrie']:[...new Set(ITEMS.filter(i=>i.cat===cat&&i.sub).map(i=>i.sub))];
  chips=['all',...subs].map(k=>`<button class="chip ${k===filt?'on':''}" data-f="${esc(k)}">${k==='all'?esc(t.all):esc(lab(k))}</button>`).join('');
 }
 $('view').innerHTML=`<div class="tools"><div class="filters">${chips}</div><input id="q" type="search" placeholder="${esc(t.search)}" value="${esc(q)}"></div><div id="grid" class="grid"></div>`;
 grid();
}
const card=i=>{
 const t=T[lang];
 let meta,tags='';
 if(i.cat==='c'){
  meta=(i.days?i.days+' '+t.days+' · ':'')+lab(i.sub);
  tags=(i.tr?`<span class="tag">${esc(lab(i.tr))}</span>`:'')+((i.lg&&i.lg[0])?`<span class="tag">${esc(lab(i.lg[0]))}</span>`:'');
 }else meta=i.cat==='n'?fmtDate(i.date):i.cat==='e'?(i.when?tx(i.when):fmtDate(i.date)):lab(i.sub);
 return `<article class="card" tabindex="0" data-id="${esc(i.id)}"><div class="ph" data-id="${esc(i.id)}"><span>${ICO[i.cat]}</span></div><div class="b"><h3>${esc(nameOf(i))}</h3><div class="meta">${esc(meta)}</div>${tags}<p class="ds">${esc(descOf(i))}</p></div></article>`;
};
function grid(){
 const cat=CATS[tab],t=T[lang],nq=norm(q);
 const ws=nq.split(/\s+/).filter(Boolean);
 const L=nq?ITEMS.filter(i=>{const z=norm(Object.values(i.n).join(' ')+' '+Object.values(i.d).join(' ')+' '+(i.w||''));return ws.every(w=>z.includes(w))}):ITEMS.filter(i=>i.cat===cat&&(filt==='all'||i.sub===filt));
 $('grid').innerHTML=L.length?L.map(card).join(''):`<p class="empty">${esc(cat==='n'&&!ITEMS.some(i=>i.cat==='n')?t.none:t.empty)}</p>`;
 if(nq.length>=3&&L.length<4)$('grid').insertAdjacentHTML('beforeend',`<div style="grid-column:1/-1;text-align:center"><button class="chip on" id="ask" data-ask="1">🔎 ${esc((ASK[lang]||ASK.en).replace('{q}',q))}</button></div>`);
 watch();
}
function setBg(el,u){
 if(!u)return;
 const im=new Image();
 im.onload=()=>{el.style.backgroundImage=`url("${u.replace(/"/g,'%22')}")`;el.classList.add('ld')};
 im.src=u;
}
let io;
function watch(){
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;io.unobserve(e.target);
  const it=byId(e.target.dataset.id);if(it)cover(it).then(u=>setBg(e.target,u));
 }),{rootMargin:'250px'});
 document.querySelectorAll('#grid .ph').forEach(p=>io.observe(p));
}

/* ---------- Fiche détail façon Netflix ---------- */
function openM(it,push=true){
 cur=it;const t=T[lang],tok=++mtok,m=$('modal');
 const tags=it.cat==='c'?[it.sub,it.tr,...(it.lg||[])].filter(Boolean):[it.sub].filter(Boolean);
 let h=`<div class="mh" id="mh"><h2>${esc(nameOf(it))}</h2></div><div class="mb">`;
 if(tags.length)h+=`<div>${tags.map(k=>`<span class="tag">${esc(lab(k))}</span>`).join('')}</div>`;
 h+=`<section><h3>${esc(t.about)}</h3>${String(descOf(it)).split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}`;
 if(it.body)h+=tx(it.body).split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
 if(it.when)h+=`<p class="src">📅 ${esc(tx(it.when))}</p>`;
 if(it.cat==='n'&&it.date)h+=`<p class="src">${esc(fmtDate(it.date))}</p>`;
 h+='</section>';
 if(it.cat==='c'){
  h+=`<section><div class="facts">`+
   (it.days?`<div><b>${esc(t.dur)}</b>${it.days} ${esc(t.days)}</div>`:'')+
   (it.tr?`<div><b>${esc(t.trn)}</b>${esc(lab(it.tr))}</div>`:'')+
   ((it.lg&&it.lg.length)?`<div><b>${esc(t.lod)}</b>${esc(it.lg.map(lab).join(' · '))}</div>`:'')+`</div>`;
  if(it.st)h+=`<div class="stg" title="${esc(t.stg)}">${it.st.split(' · ').map(s=>`<span>📍 ${esc(s)}</span>`).join('')}</div>`;
  if(Array.isArray(it.it)&&it.it.length)h+=`<div class="stg" style="display:block">${it.it.map(d=>`<p><b>${esc(t.stg)} ${esc(d.day)} :</b> ${esc(tx(d.title))} — ${esc(tx(d.text))}</p>`).join('')}</div>`;
  h+='</section>';
 }
 if(it.cat!=='n'&&it.cat!=='e')h+=`<section id="hs"><h3>${esc(t.history)}</h3><div id="hx" class="sk">${esc(t.loading)}</div></section>`;
 h+=`<section id="gs" hidden><h3>${esc(t.gallery)}</h3><div class="car"><button class="cb" data-d="-1">‹</button><div id="gx" class="gal"></div><button class="cb" data-d="1">›</button></div></section><section id="ms" hidden><h3>${esc(t.map)}</h3><div id="mx"></div></section>`+vidHtml(it)+linkHtml(it)+`</div>`;
 $('sheet').innerHTML=h;
 if(push)history.pushState({m:1},'');
 m.hidden=false;m.scrollTop=0;document.body.classList.add('lock');
 // image d'en-tête : cover connue tout de suite, version large ensuite
 const setHero=u=>{if(u&&tok===mtok)setBg($('mh'),u)};
 const ov=ovrOf(it);
 if(ov)setHero(ov);else if(it.cover)setHero(it.cover);else if(it.cvs&&it.cvs[500])setHero(it.cvs[500]);
 const gal=[...(it.gallery||[])];
 const showGal=g=>{
  const all=[...new Set(g)].slice(0,24);
  if(!all.length||tok!==mtok)return;
  $('gs').hidden=false;$('gx').innerHTML=all.map(u=>`<img src="${esc(u)}" loading="lazy" alt="${esc(nameOf(it))}">`).join('');
 };
 const showMap=(lat,lng)=>{
  if(it.route&&it.route.length>1&&tok===mtok){$('ms').hidden=false;routeMap(it.route,$('mx'),tok);return}
   if(lat==null||lng==null||tok!==mtok)return;
  const bb=[lng-.25,lat-.15,lng+.25,lat+.15].map(n=>n.toFixed(4)).join('%2C');
  $('ms').hidden=false;
  $('mx').innerHTML=`<iframe loading="lazy" title="${esc(nameOf(it))}" src="https://www.openstreetmap.org/export/embed.html?bbox=${bb}&layer=mapnik&marker=${lat}%2C${lng}"></iframe><p class="src"><a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=9/${lat}/${lng}" target="_blank" rel="noopener">${esc(t.openmap)}</a></p>`;
 };
 showGal(gal);showMap(it.lat,it.lng);
 if(it.cat==='n'||it.cat==='e')return;
 detail(it,lang).then(r=>{
  if(tok!==mtok)return;
  if(r.img&&!ov&&!it.cover)setHero(r.img);
  if(r.text){
   $('hx').className='';
   $('hx').innerHTML=cut(r.text,1600).split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')+
    `<p class="src">${esc(t.src)} — <a href="https://${r.wl}.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g,'_'))}" target="_blank" rel="noopener">${esc(r.title)}</a></p>`;
  }else $('hs').hidden=true;
  showGal([...gal,...(r.gal||[])]);
  if(it.lat==null)showMap(r.lat,r.lng);
 }).catch(()=>{if(tok===mtok)$('hs').hidden=true});
}
function closeM(){
 const m=$('modal');if(m.hidden)return;
 m.hidden=true;mtok++;document.body.classList.remove('lock');
 if(history.state&&history.state.m)history.back();
}
let LBL=[],LBI=0;
function lb(src){LBL=[...document.querySelectorAll('.gal img')].map(i=>i.src);LBI=Math.max(0,LBL.indexOf(src));$('lb').querySelector('img').src=src;$('lb').hidden=false}
function lbGo(d){if(!LBL.length)return;LBI=(LBI+d+LBL.length)%LBL.length;$('lb').querySelector('img').src=LBL[LBI]}
const ASK={fr:'Introuvable ? Lancer la recherche automatique pour « {q} »',en:'Not found? Run an automatic search for “{q}”',es:'¿No lo encuentras? Buscar automáticamente «{q}»',ar:'ما لقيتش؟ ابحث تلقائياً عن «{q}»'};
const ASKM={fr:['Recherche en cours…','Ajouté : ','Rien trouvé pour cette recherche.','Service indisponible, réessaie.'],en:['Searching…','Added: ','Nothing found.','Service unavailable, retry.'],es:['Buscando…','Añadido: ','No se encontró nada.','Servicio no disponible.'],ar:['جاري البحث…','تمت الإضافة: ','لا شيء.','الخدمة غير متاحة.']};
async function askSearch(b){
 const m=(ASKM[lang]||ASKM.en);b.disabled=true;b.textContent='⏳ '+m[0];
 try{const r=await fetch(API+'/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,cat:CATS[tab]==='c'?'a':CATS[tab]})});
  const j=await r.json();if(!r.ok)throw 0;
  if(j.added&&j.added.length){await loadApi();const n=$('ask');if(n){n.textContent='✅ '+m[1]+j.added.join(', ');n.disabled=true}}
  else b.textContent='ℹ️ '+m[2];
 }catch{b.disabled=false;b.textContent='⚠️ '+m[3]}
}
const VT={fr:'Vidéos',en:'Videos',es:'Vídeos',ar:'فيديو'},LT={fr:'Liens utiles',en:'Useful links',es:'Enlaces',ar:'روابط'};
const okU=u=>/^https?:\/\//.test(u);
const vidHtml=it=>{let h='';(it.videos||[]).filter(okU).forEach(u=>{let m;
 if(m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/))h+=`<iframe class="vid" loading="lazy" allowfullscreen src="https://www.youtube.com/embed/${m[1]}"></iframe>`;
 else if(m=u.match(/vimeo\.com\/(\d+)/))h+=`<iframe class="vid" loading="lazy" allowfullscreen src="https://player.vimeo.com/video/${m[1]}"></iframe>`;
 else if(/\.(mp4|webm)(\?|$)/i.test(u))h+=`<video class="vid" controls src="${esc(u)}"></video>`;
 else h+=`<p><a href="${esc(u)}" target="_blank" rel="noopener">▶ ${esc(u)}</a></p>`});
 return h?`<section><h3>${esc((VT[lang]||VT.en))}</h3>${h}</section>`:''};
const linkHtml=it=>{const l=(it.links||[]).filter(x=>x&&okU(x.url));return l.length?`<section><h3>${esc((LT[lang]||LT.en))}</h3>${l.map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label||x.url)}</a></p>`).join('')}</section>`:''};
const SE={fr:['Départ','Arrivée','Tracé indicatif'],en:['Start','Finish','Indicative route'],es:['Salida','Llegada','Trazado indicativo'],ar:['البداية','النهاية','مسار تقريبي']};
Object.assign(ASK,{ro:'Nu ai găsit? Caută automat «{q}»',ru:'Не нашли? Автопоиск «{q}»'});
Object.assign(ASKM,{ro:['Se caută…','Adăugat: ','Nimic găsit.','Serviciu indisponibil, reîncearcă.'],ru:['Поиск…','Добавлено: ','Ничего не найдено.','Сервис недоступен, повторите.']});
Object.assign(VT,{ro:'Videoclipuri',ru:'Видео'});Object.assign(LT,{ro:'Linkuri utile',ru:'Полезные ссылки'});
Object.assign(SE,{ro:['Start','Sosire','Traseu orientativ'],ru:['Старт','Финиш','Ориентировочный маршрут']});
const WL={fr:'Régions viticoles',en:'Wine regions',es:'Regiones vinícolas',ro:'Regiuni viticole',ru:'Винодельческие регионы'};
let LP;const loadL=()=>LP||(LP=new Promise((ok,ko)=>{const B='https://cdnjs.cloudflare.com/ajax/libs/';const css=h=>{const c=document.createElement('link');c.rel='stylesheet';c.href=B+h;document.head.append(c)};const js=(s,f,e)=>{const x=document.createElement('script');x.src=B+s;x.onload=f;x.onerror=e;document.head.append(x)};css('leaflet/1.9.4/leaflet.min.css');css('leaflet.markercluster/1.5.3/MarkerCluster.css');css('leaflet.markercluster/1.5.3/MarkerCluster.Default.css');js('leaflet/1.9.4/leaflet.min.js',()=>js('leaflet.markercluster/1.5.3/leaflet.markercluster.js',ok,ok),ko)}));
async function routeMap(pts,el,tok){
 el.innerHTML='<div style="height:340px;border-radius:12px"></div>';
 try{await loadL();if(tok!==mtok)return;const L=window.L,m=L.map(el.firstChild,{scrollWheelZoom:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(m);
  const ll=pts.map(p=>[p[1],p[2]]);L.polyline(ll,{color:'#8c2340',weight:4,dashArray:'8 6'}).addTo(m);
  pts.forEach((p,i)=>L.marker(ll[i]).addTo(m).bindPopup(`<b>${i===0?(SE[lang]||SE.en)[0]:i===pts.length-1?(SE[lang]||SE.en)[1]:''}</b><br>${esc(p[0])}`));
  m.fitBounds(ll,{padding:[30,30]});el.insertAdjacentHTML('beforeend',`<p class="src">${(SE[lang]||SE.en)[2]}</p>`);
 }catch{el.innerHTML=''}
}
const MT={fr:['Carte interactive','Carte des routes du vin (PDF)','Voir la fiche'],en:['Interactive map','Wine routes map (PDF)','View details'],es:['Mapa interactivo','Mapa de rutas del vino (PDF)','Ver ficha'],ro:['Hartă interactivă','Harta drumurilor vinului (PDF)','Vezi fișa'],ru:['Интерактивная карта','Карта винных маршрутов (PDF)','Подробнее']};
const MC={c:'#2f5d3a',a:'#c0562b',g:'#8c2340',h:'#8a5a00',t:'#1d4f9c',e:'#6b3fa0'};
let BM,BL={};
const mapHtml=()=>{const m=MT[lang]||MT.en,t=T[lang];return `<div class="tools"><div class="filters">${['c','a','g','h','t','e'].map(k=>`<button class="chip on" data-mf="${k}">${ICO[k]} ${esc(t.nav[CATS.indexOf(k)])}</button>`).join('')}</div><a class="chip on" href="Map-Wine-Routes-of-Moldova-2023-1.pdf" target="_blank" rel="noopener">📄 ${esc(m[1])}</a></div><div id="bigmap" role="region" aria-label="${esc(m[0])}"></div><div class="lgd"><b>${esc(WL[lang]||WL.en)} :</b>${Object.values(RG).map(r=>`<span><i style="background:${r.c}"></i>${esc(tx(r.n))}</span>`).join('')}</div>`};
async function initMap(){
 const el=$('bigmap'),m=MT[lang]||MT.en;
 try{await loadL()}catch{el.textContent='—';return}
 const L=window.L;if(BM){BM.remove();BM=null}BL={};

 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(BM);
 ITEMS.filter(i=>i.lat!=null&&i.lng!=null&&MC[i.cat]).forEach(i=>{

  mk.on('popupopen',e=>{const im=e.popup.getElement().querySelector('.pp');cover(i,300).then(u=>{if(u&&im){im.src=u;im.hidden=false}})});
   mk.bindPopup(`<img class="pp" alt="" hidden><b>${esc(nameOf(i))}</b><br>${esc(cut(descOf(i),110))}<br><a href="#" data-open="${esc(i.id)}">${esc(m[2])} →</a>`);
  (BL[i.cat]=BL[i.cat]||(L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:38}):L.layerGroup())).addLayer(mk);
 });
 Object.values(BL).forEach(g=>g.addTo(BM));
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let b;
 if(b=g('.lbn')){lbGo(+b.dataset.d);return}
 if(e.target.tagName==='IMG'&&g('#lb')){lbGo(1);return}

cover({id:'hero',w:"Orheiul Vechi",n:{fr:'Orheiul Vechi'}},1920).then(u=>{if(u)document.querySelector('.hero').style.setProperty('--hero',`url("${u}")`)});
loadApi();
})();
