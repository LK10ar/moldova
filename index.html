main{max-width:1180px;margin:auto;padding:22px 16px;scroll-margin-top:90px}

.ph.ld span{display:none}
.card .b{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:18px}

.gal img{flex:0 0 min(78%,420px);scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--line)}

.sk{color:var(--mut);font:14px system-ui}
.src{font:13px system-ui;color:var(--mut)}.src a{color:var(--acc)}

.lb{position:fixed;inset:0;z-index:90;background:#000e;display:grid;place-items:center;cursor:zoom-out}

const byId=id=>ITEMS.find(i=>i.id===id);
const fmtDate=d=>{try{return d?new Date(d).toLocaleDateString(lang):''}catch{return''}};
const cut=(s,n)=>{if(s.length<=n)return s;const i=s.lastIndexOf('. ',n);return s.slice(0,i>250?i+1:n)+(i>250?'':'…')};

/* ---------- Wikipédia (photos, histoire, coordonnées) ---------- */
const wapi=async(h,p)=>{
 const u=new URL(`https://${h}.wikipedia.org/w/api.php`);
 Object.entries({action:'query',format:'json',origin:'*',redirects:1,...p}).forEach(([k,v])=>u.searchParams.set(k,v));
 const r=await fetch(u);if(!r.ok)throw new Error('http');
 const j=await r.json();return Object.values((j.query&&j.query.pages)||{});
};
async function cover(it,sz=500){
 if(it.cover)return it.cover;
 it.cvs=it.cvs||{};
 if(it.cvs[sz]!==undefined)return it.cvs[sz];
 const key='dz2:'+it.id+':'+sz;
 try{const c=JSON.parse(ls.get(key)||'null');if(c&&Date.now()-c.t<6048e5)return it.cvs[sz]=c.u}catch{}
 let u=null,ok=false;
 try{
  const ps=(await wapi('fr',{generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz})).sort((a,b)=>a.index-b.index);
  const p=ps.find(p=>p.thumbnail);u=p?p.thumbnail.source:null;ok=true;
   if(!u){const p2=(await wapi('fr',{generator:'search',gsrsearch:tx(it.n,'fr')+' Moldavie',gsrlimit:4,prop:'pageimages',piprop:'thumbnail',pithumbsize:sz})).sort((a,b)=>a.index-b.index).find(p=>p.thumbnail);u=p2?p2.thumbnail.source:null}
 }catch{}
 it.cvs[sz]=u;
 if(ok)ls.set(key,JSON.stringify({u,t:Date.now()}));
 return u;
}
async function detail(it,lg){
 const p={generator:'search',gsrsearch:it.w||tx(it.n,'fr'),gsrlimit:4,prop:'extracts|pageimages|coordinates|langlinks',exintro:1,explaintext:1,exlimit:'max',piprop:'thumbnail',pithumbsize:1280,colimit:1,lllimit:1};
 if(lg!=='fr')p.lllang=lg;
 const ps=(await wapi('fr',p)).sort((a,b)=>a.index-b.index);
 const m=ps[0];if(!m)return{gal:[]};
 const r={title:m.title,wl:'fr',text:m.extract||'',gal:[]};
 const im=ps.find(x=>x.thumbnail);r.img=im&&im.thumbnail.source;
 const co=(m.coordinates||[])[0];if(co){r.lat=co.lat;r.lng=co.lon}
 const ll=m.langlinks&&m.langlinks[0];
 const jobs=[];
 if(lg!=='fr'&&ll)jobs.push(wapi(lg,{titles:ll['*'],prop:'extracts',exintro:1,explaintext:1}).then(a=>{const x=a[0];if(x&&x.extract){r.text=x.extract;r.title=x.title;r.wl=lg}}).catch(()=>{}));
 jobs.push(wapi('fr',{generator:'images',titles:m.title,gimlimit:50,prop:'imageinfo',iiprop:'url|mime',iiurlwidth:960}).then(a=>{
  r.gal=a.filter(x=>{const i=x.imageinfo&&x.imageinfo[0];return i&&/jpeg/.test(i.mime)&&i.thumburl&&!BAD.test(x.title)}).map(x=>x.imageinfo[0].thumburl).slice(0,12);
 }).catch(()=>{}));
 await Promise.all(jobs);
 return r;
}

  const mk=L.marker([i.lat,i.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${c}">${i.sub==='vin'?'🍷':ICO[i.cat]}</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-14]})});
  mk.bindPopup(`<b>${esc(nameOf(i))}</b><br>${esc(cut(descOf(i),110))}<br><a href="#" data-open="${esc(i.id)}">${esc(m[2])} →</a>`);
  (BL[i.cat]=BL[i.cat]||L.layerGroup()).addLayer(mk);
 });
 Object.values(BL).forEach(g=>g.addTo(BM));
}
function closeNav(){document.body.classList.remove('nav-open');$('bg').textContent='☰';$('bg').setAttribute('aria-expanded','false')}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let b;
 if(b=g('.lbn')){lbGo(+b.dataset.d);return}
 if(e.target.tagName==='IMG'&&g('#lb')){lbGo(1);return}
 if(b=g('.cb')){const tr=b.parentNode.querySelector('.gal');tr.scrollBy({left:+b.dataset.d*tr.clientWidth*.8,behavior:'smooth'});return}
 if(b=g('[data-ask]')){askSearch(b);return}
 if(b=g('[data-open]')){e.preventDefault();const it=byId(b.dataset.open);if(it)openM(it);return}
 if(b=g('[data-mf]')){const k=b.dataset.mf,on=b.classList.toggle('on');on?BL[k].addTo(BM):BM.removeLayer(BL[k]);return}
 if(g('#lb')){$('lb').hidden=true;return}
 if(b=g('[data-tab]')){tab=+b.dataset.tab;filt='all';q='';closeNav();render();document.querySelector('main').scrollIntoView({behavior:'smooth'});return}
 if(b=g('[data-f]')){filt=b.dataset.f;render();return}
 if(b=g('.gal img')){lb(b.src);return}
 if(g('.x')){closeM();return}
 if(e.target.id==='modal'){closeM();return}
 if(b=g('.card')){const it=byId(b.dataset.id);if(it)openM(it)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;grid()}});
document.addEventListener('keydown',e=>{
 if(!$('lb').hidden&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){lbGo(e.key==='ArrowRight'?1:-1);return}
 if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else if(!$('modal').hidden)closeM();else closeNav()}
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){const it=byId(e.target.dataset.id);if(it)openM(it)}
});
window.addEventListener('popstate',()=>{if(!$('modal').hidden){$('modal').hidden=true;mtok++;document.body.classList.remove('lock')}});
$('lang').onchange=e=>{lang=e.target.value;ls.set('lang',lang);render();if(!$('modal').hidden&&cur)openM(cur,false)};
$('bg').onclick=()=>{const o=document.body.classList.toggle('nav-open');$('bg').textContent=o?'✕':'☰';$('bg').setAttribute('aria-expanded',o)};
$('scrim').onclick=closeNav;
$('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>$('top').classList.toggle('show',window.scrollY>500),{passive:true});
window.addEventListener('resize',()=>{if(innerWidth>820)closeNav()});

render();
cover({id:'hero',w:"Orheiul Vechi",n:{fr:'Orheiul Vechi'}},1920).then(u=>{if(u)document.querySelector('.hero').style.setProperty('--hero',`url("${u}")`)});
loadApi();
})();
</script></body></html>
