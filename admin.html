<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09151a">
<title>Moldova Explorer — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09151a;--s1:#0f1d24;--s2:#14262e;--s3:#1a3039;--line:#ffffff1a;--line2:#ffffff2e;--fg:#f6ece0;--mut:#b9a99b;--wine:#1fa37a;--wine2:#0f6b4f;--gold:#e8b45a;--ok:#3aa86a;--warn:#e0a13a;--bad:#e5615f;--r:14px;--ff:'Playfair Display',Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
 background-image:radial-gradient(60% 40% at 10% 0%,#1fa37a30,transparent 70%),radial-gradient(50% 35% at 100% 20%,#e8b45a14,transparent 70%);background-attachment:fixed}
.hide{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
::selection{background:#e8b45a55}
input,select,textarea{width:100%;background:#ffffff0a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#ffffff59}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#ffffff12;box-shadow:0 0 0 3px #e8b45a24}
select option{color:#111;background:#fff}
textarea{resize:vertical;min-height:92px;line-height:1.5}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
label.f>em{display:block;margin-top:5px;font-size:12px;font-style:normal;color:#ffffff73}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:#ffffff0d;color:var(--fg);border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:#ffffff1c;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--wine),var(--wine2));border-color:transparent;color:#fff;box-shadow:0 8px 22px #1fa37a55}
.btn.pri:hover{box-shadow:0 12px 28px #1fa37a99}
.btn.gold{background:linear-gradient(135deg,#f0c36d,#d79a34);border-color:transparent;color:#2a1a05}
.btn.bad{border-color:#e5615f66;color:#ff9b99}.btn.bad:hover{background:#e5615f22}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ico{padding:7px 9px;min-width:34px}

/* ---------- connexion ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);padding:34px 30px;border-radius:24px;background:linear-gradient(180deg,#ffffff0f,#ffffff06);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 30px 80px #000a}
.logo-badge{width:54px;height:54px;border-radius:50%;background:#f6ece0;position:relative;overflow:hidden;margin-bottom:18px}
.logo-badge::before{content:"";position:absolute;inset:-18%;background:var(--wine);clip-path:polygon(0 20%,100% 8%,100% 19%,0 31%,0 43%,100% 31%,100% 42%,0 54%,0 66%,100% 54%,100% 65%,0 77%)}
.login h1{font:600 30px/1.1 var(--ff);margin:0 0 6px}
.login p{margin:0 0 22px;color:var(--mut)}
.err{min-height:20px;margin:10px 0 0;color:var(--bad);font-size:14px}

/* ---------- application ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--line);background:#050d10a6;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 20px;font:600 21px/1 var(--ff)}
.brand small{display:block;margin-top:4px;font:600 10px/1 system-ui;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand .logo-badge{width:38px;height:38px;margin:0;flex:0 0 auto}
.menu{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.menu h4{margin:16px 10px 6px;font:700 10px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#ffffff59}
.mi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:600;color:#f6ece0cc;transition:background .15s,color .15s}
.mi:hover{background:#ffffff12;color:#fff}
.mi.on{background:linear-gradient(135deg,#1fa37a33,#0f6b4f33);color:#fff;box-shadow:inset 0 0 0 1px #1fa37a66}
.mi .ic{width:22px;text-align:center;font-size:17px}
.mi .cnt{margin-left:auto;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:#ffffff14;font-size:12px}
.mi .cnt.alert{background:var(--gold);color:#2a1a05}
.side-foot{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.main{min-width:0;padding:0 clamp(16px,3vw,40px) 80px}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 0;margin-bottom:6px;background:linear-gradient(var(--bg) 70%,transparent)}
.topbar h2{font:600 clamp(26px,3vw,36px)/1.1 var(--ff);margin:0;margin-right:auto}
.topbar h2 small{display:block;margin-top:5px;font:400 14px/1.3 system-ui;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 18px}
.tools .search{flex:1 1 240px;max-width:380px;position:relative}
.tools .search input{padding-left:38px}
.tools .search::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--mut)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:#ffffff0d;border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:#ffffff1f;color:#fff}

/* ---------- liste ---------- */
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r);background:linear-gradient(180deg,#ffffff0b,#ffffff05);border:1px solid var(--line);transition:border-color .15s,transform .15s,background .15s}
.row:hover{border-color:var(--line2);background:#ffffff0f}
.thumb{flex:0 0 74px;height:54px;border-radius:10px;background:var(--s3) center/cover;display:grid;place-items:center;font-size:22px;color:#ffffff59}
.row .info{min-width:0;flex:1}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .acts{display:flex;gap:6px;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pub{background:#3aa86a26;color:#6fdc9d}
.pill.dra{background:#e0a13a26;color:#f3c067}
.pill.ev{background:#1fa37a33;color:#7ff0c4}.pill.ev::before{display:none}
.empty{padding:50px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;font:600 22px var(--ff);color:var(--fg);margin-bottom:6px}
.skeleton{height:74px;border-radius:var(--r);background:linear-gradient(90deg,#ffffff08,#ffffff14,#ffffff08);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- tiroir d'édition ---------- */
.veil{position:fixed;inset:0;z-index:60;background:#000b;backdrop-filter:blur(3px);animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(780px,100%);display:flex;flex-direction:column;background:linear-gradient(180deg,#10222a,#0a161b);border-left:1px solid var(--line2);box-shadow:-30px 0 80px #000c;animation:slide .28s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dh{display:flex;align-items:center;gap:12px;padding:18px 22px 12px}
.dh h3{margin:0;font:600 24px/1.15 var(--ff);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn);flex:0 0 auto}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:11px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
.db{flex:1;overflow-y:auto;padding:22px}
.pane{display:none;animation:fade .2s}.pane.on{display:block}
.df{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#050d10cc}
.df .msg{margin-right:auto;font-size:14px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.card-sec{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:#ffffff06;margin-bottom:16px}
.card-sec>h5{margin:0 0 12px;font:600 18px var(--ff)}
.langs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:#ffffff0a;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.langs button.on{background:var(--gold);border-color:var(--gold);color:#2a1a05}
.langs button.has::after{content:" •";color:var(--ok)}
.langs button.on.has::after{color:#2a1a05}
.lp{display:none}.lp.on{display:block}
.prev{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px;background:var(--s3)}
.prev:not([src]),.prev[src=""]{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--s3)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;user-select:none;font-size:14px}
.checks input{width:auto;accent-color:var(--gold)}
.checks label:has(input:checked){background:#e8b45a26;border-color:var(--gold)}
#pick .leaflet-tile-pane{filter:invert(1) hue-rotate(198deg) brightness(.92) contrast(.9) saturate(.75)}
#pick{height:320px;border-radius:12px;border:1px solid var(--line);margin-top:10px;overflow:hidden}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.json{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:220px}
.hint{font-size:13px;color:var(--mut);margin:0 0 14px}

/* ---------- accueil : galerie / cartes / vidéo ---------- */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gitem{position:relative;border-radius:16px;background:linear-gradient(180deg,#ffffff0d,#ffffff05);border:1px solid var(--line);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.gitem:hover{border-color:var(--line2)}
.gitem.drag{opacity:.35;transform:scale(.97)}
.gitem.over{border-color:var(--gold);box-shadow:0 0 0 3px #e8b45a33}
.gthumb{position:relative;aspect-ratio:3/2;background:var(--s3) center/cover;cursor:grab}
.gthumb .n{position:absolute;top:8px;left:8px;min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:#000b;display:grid;place-items:center;font-weight:800;font-size:13px}
.gthumb .h{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;background:#000b;display:grid;place-items:center;letter-spacing:-2px;font-weight:900;color:#ffffffb3}
.gcap{padding:10px 12px 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcap.none{color:#ffffff59;font-weight:400;font-style:italic}
.glink{padding:0 12px;font-size:12px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.gact{display:flex;gap:6px;padding:8px 12px 12px}
.gact .btn{flex:1}
.addtile{display:grid;place-items:center;align-content:center;gap:6px;min-height:200px;border:2px dashed var(--line2);border-radius:16px;background:none;color:var(--mut);font-weight:700;transition:border-color .2s,color .2s,background .2s}
.addtile:hover{border-color:var(--gold);color:var(--gold);background:#e8b45a0d}
.addtile b{font-size:34px;line-height:1}
.hcards{display:grid;gap:16px}
.hcard{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff0b,#ffffff05)}
.hcard .vis{position:relative;border-radius:14px;min-height:180px;background:var(--g,#333) center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;overflow:hidden;isolation:isolate}
.hcard .vis::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#0000 30%,#000c)}
.hcard .vis b{font:600 26px/1 var(--ff)}
.hcard .vis span{font-size:12px;opacity:.8}
.hcard h5{margin:0 0 10px;font:600 20px var(--ff);display:flex;align-items:center;gap:10px}
.vid-prev{width:100%;max-height:340px;border-radius:14px;background:#000;margin-top:12px}
.savebar{position:sticky;bottom:14px;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#14262ee6;border:1px solid var(--gold);box-shadow:0 18px 50px #000a;backdrop-filter:blur(12px);margin-top:22px;animation:fade .2s}
.savebar span{margin-right:auto;font-weight:600}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#000b;backdrop-filter:blur(3px);animation:fade .2s}
.mbox{width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:22px;background:linear-gradient(180deg,#14262e,#0c1a20);border:1px solid var(--line2);box-shadow:0 40px 100px #000c;animation:pop .25s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.mbox.wide{width:min(900px,100%)}
.mbox h3{margin:0;padding:20px 22px 6px;font:600 24px var(--ff)}
.mbox .mb{padding:10px 22px 6px;overflow-y:auto}
.mbox .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pitem{position:relative;aspect-ratio:4/3;border-radius:10px;background:var(--s3) center/cover;border:2px solid transparent;cursor:pointer;overflow:hidden}
.pitem.sel{border-color:var(--gold);box-shadow:0 0 0 3px #e8b45a44}
.pitem.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1a05;display:grid;place-items:center;font-weight:900}
.pitem i{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 5px;font:600 11px/1.2 system-ui;font-style:normal;background:linear-gradient(#0000,#000c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand{display:flex;gap:14px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:#ffffff08}
.cand .thumb{flex:0 0 110px;height:80px}
.cand p{margin:4px 0 0;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cand .acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;background:#14262ef2;border:1px solid var(--line2);box-shadow:0 14px 40px #000a;font-weight:600;animation:pop .25s cubic-bezier(.22,1,.36,1)}
.toast.ok{border-color:#3aa86a99}.toast.ok::before{content:"✓  ";color:var(--ok)}
.toast.err{border-color:#e5615f99}.toast.err::before{content:"✕  ";color:var(--bad)}

@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:hidden}
 .brand{padding:0 6px 0 0}.brand small,.brand span{display:none}
 .menu{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}.menu::-webkit-scrollbar{display:none}
 .menu h4{display:none}
 .mi{flex:0 0 auto;width:auto;padding:8px 12px;white-space:nowrap}.mi .cnt{display:none}
 .side-foot{display:flex;flex:0 0 auto;border:0;padding:0}.side-foot .btn span{display:none}
 .topbar{position:static}
 .hcard{grid-template-columns:1fr}
 .g2,.g3{grid-template-columns:1fr}
 .row2{grid-template-columns:1fr 1fr}.row2 .btn{grid-column:1/-1}
 .row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-end}
 .drawer{width:100%;border-left:0}
 .cand{flex-wrap:wrap}.cand .acts{flex-direction:row;width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.srch{display:flex;gap:8px;margin-bottom:8px}.srch input{flex:1}
.tkres{display:grid;gap:6px;margin-bottom:10px;max-height:260px;overflow:auto}
.tkr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#ffffff0a;color:var(--fg)}
button.tkr{cursor:pointer}button.tkr:hover{border-color:var(--gold);background:#e8b45a14}
.tkr b{font-weight:700}.tkr span{grid-column:1;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkr em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:700;color:var(--gold);font-size:13px}
.tkr.dim{color:var(--mut);border-style:dashed;display:block}
#tkMap{height:380px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
#tkMap .leaflet-tile-pane{filter:invert(1) hue-rotate(198deg) brightness(.92) contrast(.9) saturate(.75)}
.tkpin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffd35c,#e0952c);color:#2a1a05;font:800 14px system-ui;border:2px solid #fff;box-shadow:0 4px 12px #000a;cursor:grab}
.tklist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.tks{display:grid;grid-template-columns:34px 1fr auto;gap:6px 10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:#ffffff08}
.tks .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffd35c,#e0952c);color:#2a1a05;font-weight:800}
.tks .tkf{display:grid;gap:6px;grid-template-columns:1fr 1.4fr}.tks .tka{display:flex;gap:4px}
.tks .co{grid-column:2/4;font-size:12px;color:var(--mut)}
.tk-empty{padding:18px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:12px}
details.card-sec summary{cursor:pointer;font:600 16px var(--ff)}
@media(max-width:900px){.tks .tkf{grid-template-columns:1fr}}

.rng{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;margin:0 0 12px;font-size:14px}
.rng span{color:var(--mut)}.rng input[type=range]{accent-color:var(--gold);padding:0;background:none;border:0}.rng output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bgprev{position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b1a33;display:grid;place-items:center}
.bgprev .bgp-img{position:absolute;inset:-6%;background-size:cover;background-position:center}
.bgprev b{position:relative;font:600 16px var(--ff);text-shadow:0 2px 12px #000}
.bgprev.auto::after{content:"Photo automatique du pays (aperçu non disponible ici)";position:absolute;left:10px;right:10px;bottom:8px;font-size:12px;color:var(--mut);text-align:center}
@media(max-width:900px){.rng{grid-template-columns:1fr 64px}.rng span{grid-column:1/-1}}

.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lcard{padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff0b,#ffffff05)}
.lh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.lh .ln{font:600 20px var(--ff)}.lh small{color:var(--mut)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}.sw input{width:auto;accent-color:var(--gold)}
.pbar{height:12px;border-radius:99px;background:#ffffff14;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f0c36d,#d79a34);box-shadow:0 0 14px #e8b45a88;transition:width .5s}
.pinfo{margin-top:8px;font-size:13px;color:var(--mut)}.pinfo b{color:var(--fg);font-size:15px}
.lmsg{margin-top:10px;padding:10px 12px;border-radius:10px;background:#e8b45a1a;border:1px solid #e8b45a55;font-size:13px;line-height:1.45}.lmsg.bad{background:#e5615f1f;border-color:#e5615f66}
.spin{color:var(--gold);font-size:13px;align-self:center;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.35}}
code{background:#ffffff14;padding:1px 6px;border-radius:6px;font-size:.92em}
